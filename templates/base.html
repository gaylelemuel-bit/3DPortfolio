{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="bg-frame" aria-hidden="true">
        <div class="frame-border"></div>

        <div class="corner-ornament corner-tl">
            <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
                <polygon points="0,0 170,0 0,170" fill="#010e06"/>
                <polygon points="0,0 120,0 0,120" fill="#01280f"/>
                <polygon points="0,0 80,0 0,80"  fill="#010e06"/>
                <polygon points="0,0 48,0 0,48"  fill="#01280f"/>
                <polyline points="170,0 0,0 0,170" fill="none" stroke="#b38b3d" stroke-width="1.2"/>
                <polyline points="120,0 0,0 0,120" fill="none" stroke="#ffcc66" stroke-width="2"/>
                <polyline points="80,0 0,0 0,80"   fill="none" stroke="#b38b3d" stroke-width="1.5"/>
                <polyline points="48,0 0,0 0,48"   fill="none" stroke="#ffcc66" stroke-width="1.5"/>
                <line x1="22" y1="0" x2="22" y2="180" stroke="#b38b3d" stroke-width="0.6" opacity="0.5"/>
                <line x1="0" y1="22" x2="180" y2="22" stroke="#b38b3d" stroke-width="0.6" opacity="0.5"/>
                <circle cx="1" cy="1" r="3" fill="#ffcc66" opacity="0.9"/>
            </svg>
        </div>

        <div class="corner-ornament corner-tr">
            <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
                <polygon points="180,0 10,0 180,170" fill="#010e06"/>
                <polygon points="180,0 60,0 180,120" fill="#01280f"/>
                <polygon points="180,0 100,0 180,80"  fill="#010e06"/>
                <polygon points="180,0 132,0 180,48"  fill="#01280f"/>
                <polyline points="10,0 180,0 180,170" fill="none" stroke="#b38b3d" stroke-width="1.2"/>
                <polyline points="60,0 180,0 180,120" fill="none" stroke="#ffcc66" stroke-width="2"/>
                <polyline points="100,0 180,0 180,80"   fill="none" stroke="#b38b3d" stroke-width="1.5"/>
                <polyline points="132,0 180,0 180,48"   fill="none" stroke="#ffcc66" stroke-width="1.5"/>
                <line x1="158" y1="0" x2="158" y2="180" stroke="#b38b3d" stroke-width="0.6" opacity="0.5"/>
                <line x1="0" y1="22" x2="180" y2="22" stroke="#b38b3d" stroke-width="0.6" opacity="0.5"/>
                <circle cx="179" cy="1" r="3" fill="#ffcc66" opacity="0.9"/>
            </svg>
        </div>

        <div class="corner-ornament corner-bl">
            <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
                <polygon points="0,180 170,180 0,10" fill="#010e06"/>
                <polygon points="0,180 120,180 0,60" fill="#01280f"/>
                <polygon points="0,180 80,180 0,100"  fill="#010e06"/>
                <polygon points="0,180 48,180 0,132"  fill="#01280f"/>
                <polyline points="170,180 0,180 0,10" fill="none" stroke="#b38b3d" stroke-width="1.2"/>
                <polyline points="120,180 0,180 0,60" fill="none" stroke="#ffcc66" stroke-width="2"/>
                <polyline points="80,180 0,180 0,100"   fill="none" stroke="#b38b3d" stroke-width="1.5"/>
                <polyline points="48,180 0,180 0,132"   fill="none" stroke="#ffcc66" stroke-width="1.5"/>
                <line x1="22" y1="0" x2="22" y2="180" stroke="#b38b3d" stroke-width="0.6" opacity="0.5"/>
                <line x1="0" y1="158" x2="180" y2="158" stroke="#b38b3d" stroke-width="0.6" opacity="0.5"/>
                <circle cx="1" cy="179" r="3" fill="#ffcc66" opacity="0.9"/>
            </svg>
        </div>

        <div class="corner-ornament corner-br">
            <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
                <polygon points="180,180 10,180 180,10" fill="#010e06"/>
                <polygon points="180,180 60,180 180,60" fill="#01280f"/>
                <polygon points="180,180 100,180 180,100"  fill="#010e06"/>
                <polygon points="180,180 132,180 180,132"  fill="#01280f"/>
                <polyline points="10,180 180,180 180,10" fill="none" stroke="#b38b3d" stroke-width="1.2"/>
                <polyline points="60,180 180,180 180,60" fill="none" stroke="#ffcc66" stroke-width="2"/>
                <polyline points="100,180 180,180 180,100"   fill="none" stroke="#b38b3d" stroke-width="1.5"/>
                <polyline points="132,180 180,180 180,132"   fill="none" stroke="#ffcc66" stroke-width="1.5"/>
                <line x1="158" y1="0" x2="158" y2="180" stroke="#b38b3d" stroke-width="0.6" opacity="0.5"/>
                <line x1="0" y1="158" x2="180" y2="158" stroke="#b38b3d" stroke-width="0.6" opacity="0.5"/>
                <circle cx="179" cy="179" r="3" fill="#ffcc66" opacity="0.9"/>
            </svg>
        </div>

        <div class="side-ornament side-right">
            <svg viewBox="0 0 80 200" xmlns="http://www.w3.org/2000/svg">
                <polygon points="80,0 80,60 20,30"  fill="#01280f"/>
                <polygon points="80,70 80,130 20,100" fill="#010e06"/>
                <polygon points="80,140 80,200 20,170" fill="#01280f"/>
                <polyline points="80,0 20,30 80,60"   fill="none" stroke="#ffcc66" stroke-width="2"/>
                <polyline points="80,70 20,100 80,130"  fill="none" stroke="#b38b3d" stroke-width="1.5"/>
                <polyline points="80,140 20,170 80,200" fill="none" stroke="#ffcc66" stroke-width="2"/>
            </svg>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo03" aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand" href="{% url 'mission' %}">3D Portfolio</a>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link {% if request.resolver_match.url_name == 'mission' %}active{% endif %}" href="{% url 'mission' %}">My Mission</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.resolver_match.url_name == 'experience' %}active{% endif %}" href="{% url 'experience' %}">Experience</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}" href="{% url 'projects' %}">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    {% block full_width %}{% endblock %}
    <div class="container mt-0">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
